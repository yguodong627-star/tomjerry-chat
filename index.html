<div id="stage">
  <div id="title" title="双击或长按：设置">猫和老鼠 · 聊天小屋<small>Tom &amp; Jerry 风格同人小游戏</small></div>
  <button id="modelChip" title="选择模型"><span class="dot"></span><span id="modelName">gpt-4o-mini</span><svg viewBox="0 0 12 12" width="10" height="10"><path d="M2 4l4 4 4-4" fill="none" stroke="#2b2320" stroke-width="2" stroke-linecap="round"/></svg></button>
  <button id="gear" aria-label="设置" title="设置">
    <svg viewBox="0 0 24 24" fill="#fff8e6" stroke="#2b2320" stroke-width="1.2"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.2 5-.1-3 2-1.6-2-3.4-2.4.9-2.6-1.5L12.7 1H8.8l-.4 2.6-2.6 1.5-2.4-.9-2 3.4 2 1.6v3l-2 1.6 2 3.4 2.4-.9 2.6 1.5.4 2.6h3.9l.4-2.6 2.6-1.5 2.4.9 2-3.4z" transform="translate(1 0)"/></svg>
  </button>

  <div id="charSlot" hidden></div>
  <div class="nametag" id="nametag">汤姆</div>
  <div id="talk"></div>
</div>

<div id="rec"><div id="wave"></div><div id="recText"></div><div id="recHint">松开 发送 · 上滑 取消</div></div>
<div id="toast"></div>

<!-- bottom bar: the only on-screen controls -->
<div id="bar">
  <button class="ib" id="modeBtn" aria-label="切换输入方式" title="输入文本 / 按住说话"></button>
  <button id="hold">按住 说话</button>
  <div id="textwrap"><input id="txt" type="text" placeholder="输入文本…" maxlength="500" autocomplete="off"><button id="sendBtn">发送</button></div>
  <button id="swap" title="切换角色"><svg viewBox="0 0 24 24" fill="none" stroke="#2b2320" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg><span>切换角色</span></button>
</div>

<!-- model picker popover (shared by the top chip and the settings overlay) -->
<div id="mpick"><div class="mp-head"><input id="mpQ" type="text" spellcheck="false" autocomplete="off" placeholder="搜索或输入模型 ID…"><button id="mpRefresh" title="重新获取模型列表">↻</button></div><div id="mpList"></div><div id="mpFoot"></div></div>

<!-- setup overlay (one-time; reopen via double-click / long-press title, or tiny gear) -->
<div id="setup">
  <div class="card">
    <button class="x" id="setupClose" aria-label="关闭">×</button>
    <h2>🧀 欢迎来到聊天小屋</h2>
    <p class="sub">请填写 OpenAI 兼容接口信息（只保存在本机浏览器）。</p>
    <label for="cfgBase">API 地址（Base URL）</label>
    <input id="cfgBase" type="text" spellcheck="false" placeholder="https://aihubmix.com/v1">
    <label for="cfgKey">API Key</label>
    <div class="keyrow"><input id="cfgKey" type="password" spellcheck="false" placeholder="sk-..."><button id="eyeBtn" type="button">显示</button></div>
    <label for="cfgModel">模型</label>
    <div class="keyrow"><input id="cfgModel" type="text" spellcheck="false" placeholder="gpt-4o-mini" style="padding-right:74px"><button id="cfgModelPick" type="button">选择 ▾</button></div>
    <button class="go" id="setupSave">保存并开始</button>
    <div class="row2" id="setupExtra"><button id="clearCur">清空当前角色记录</button><button id="clearAll">清空全部记录</button></div>
    <div class="note">提示：以后双击（或长按）左上角标题、或点右上角小齿轮，可再次打开此设置；点标题下方的模型名可随时切换模型。语音识别使用浏览器自带功能（推荐 Chrome / Edge），需要联网与麦克风权限。</div>
  </div>
</div>
